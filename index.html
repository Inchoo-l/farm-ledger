<head>

<title>帳簿アプリ</title>
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">

<body>
<header>
  <h1>帳簿アプリ</h1>
  <label class="yr">年分
    <select id="year"></select></label>
  <button class="g" onclick="backup()">💾 バックアップを保存</button>
  <button class="g" id="undoBtn" onclick="undo()" aria-label="元に戻す">↩<span class="t"> 元に戻す</span></button>
  <button class="g" id="redoBtn" onclick="redo()" aria-label="やり直す">↪<span class="t"> やり直す</span></button>
  <button class="g" id="syncBtn" onclick="syncClick()">🔗 共有ファイル</button>
  <span id="lastBk" role="status" aria-live="polite"></span>
  <div id="saveError" role="alert" hidden></div>
  <div id="modes"></div>
  <div id="status"></div>
</header>
<nav id="nav"></nav>
<main id="view"></main>
<footer><a href="privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a></footer>
<dialog id="dlg"><form method="dialog" id="frm"></form></dialog>
<!-- 区画マップの「かんたん入力」（スマホでは画面の下から出る） -->
<dialog id="qs" class="sheet"><form method="dialog" id="qsFrm"></form></dialog>
<div id="tip" popover="manual"></div>
<div id="toast" hidden></div>
